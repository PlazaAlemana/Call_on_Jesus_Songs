<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call on Jesus Ministries e.V - Liederbuch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            padding: 40px 20px;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.3em;
            opacity: 0.95;
            font-style: italic;
        }

        .songs-grid {
            display: grid;
            gap: 20px;
            margin-bottom: 40px;
        }

        .song-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            cursor: move;
            cursor: grab;
            touch-action: none;
        }

        .song-card:active {
            cursor: grabbing;
        }

        .song-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .song-card.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .song-header {
            padding: 25px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .song-header-left {
            display: flex;
            align-items: center;
            flex: 1;
            pointer-events: none;
        }

        .song-number {
            font-size: 2em;
            font-weight: bold;
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
        }

        .song-title {
            flex: 1;
            font-size: 1.5em;
            font-weight: bold;
        }

        .expand-icon {
            font-size: 1.5em;
            transition: transform 0.3s ease;
            pointer-events: none;
        }

        .song-card.expanded .expand-icon {
            transform: rotate(180deg);
        }

        .song-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
            padding: 0 25px;
        }

        .song-card.expanded .song-content {
            max-height: 3000px;
            padding: 25px;
        }

        .song-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-label {
            font-weight: bold;
            color: #667eea;
            font-size: 0.9em;
        }

        .control-btn {
            background: #667eea;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: #5568d3;
            transform: scale(1.1);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .verse {
            margin-bottom: 20px;
            line-height: 1.8;
            transition: font-size 0.3s ease;
        }

        .verse-label {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
            display: block;
        }

        .chord {
            color: #d9534f;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
        }

        footer {
            text-align: center;
            color: white;
            padding: 20px;
            font-size: 0.9em;
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }
            
            .song-title {
                font-size: 1.2em;
            }

            .song-controls {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Call on Jesus Ministries e.V</h1>
            <p class="subtitle">Unser Liederbuch</p>
        </header>

        <div class="songs-grid" id="songsContainer">
            <!-- Songs will be inserted here by JavaScript -->
        </div>

        <footer>
            <p>© 2025 Call on Jesus E.V - Gemeinsam in Lobpreis vereint</p>
        </footer>
    </div>

    <script>
        let songsData = [
            {
                title: "Preis den Herrn",
                fontSize: 1.1,
                verses: [
                    { label: "Intro", text: "Ja, alles was Atem hat,\npreis den Herrn,\npreis den Herrn!" },
                    { label: "Vers 1", text: "Ich preis dich in Tälern,\npreis dich auf Höhen.\nIch preis, wenn ich glaub,\nwenn Zweifel mich quälen.\nIch preis dich in Schwachheit,\nwenn ich umringt bin.\nMein Lob ist wie Wasser,\nlässt Feinde ertrinken." },
                    { label: "Pre-Chorus", text: "Solange ich atme\nhab ich viele Gründe, drum:" },
                    { label: "Chorus", text: "Preis den Herrn, Seele, sing!\nPreis den Herrn, Seele, sing!" },
                    { label: "Vers 2", text: "Ich preis, wenn ich's fühle,\nund ich preis, tu ich's nicht.\nIch preis, weil ich weiß:\ndu hast alles im Griff.\nMein Lob dient als Waffe,\nist mehr als ein Lied,\nder Jericho-Schrei,\nder die Mauern besiegt." },
                    { label: "Bridge", text: "Ich preis dich, mein König,\nweil du regierst,\npreis, denn du lebst\nund der Tod ist besiegt.\nIch preis, weil du wahr bist,\ntreu immerzu,\npreis dich, denn niemand ist\ngrößer als du." }
                ]
            },
            {
                title: "Keiner Ist Wie Du",
                fontSize: 1.1,
                verses: [
                    { label: "Chorus", text: "Keiner ist wie du!\nNiemand sonst berührt mein Herz so wie du.\nWo auch immer ich noch suchte, o Herr,\nes bleibt: Keiner ist wie du!" },
                    { label: "Vers", text: "Erbarmen fließt wie ein weiter Strom,\nund Heilung strömt aus deiner Hand.\nKinder mit Wunden sind sicher bei dir.\nKeiner ist wie du!" }
                ]
            },
            {
                title: "Dieser Fluss macht lebendig",
                fontSize: 1.1,
                verses: [
                    { label: "Vers 1", text: "Ein Strom der Güte\nDer Täler füllt\nFliesst aus der Quelle\nDie Leiden stillt\nBis in die Meere\nWo Angst versinkt\nDie Fluten steigen, steigen" },
                    { label: "Vers 2", text: "Wie eine Strömung\nDie tief aufwühlt\nAus Gottes Herzen\nAus überfliesst\nDer Strom des Himmels\nGiesst sich über uns\nDie Fluten steigen, steigen" },
                    { label: "Chorus", text: "Reissende Wasser, reissende Wasser\nBrechen hervor aus hartem Stein.\nReissende Wasser, reissende Wasser\nBrechen hervor aus hartem Stein.\nUnd dieser Fluss macht lebendig" },
                    { label: "Bridge", text: "Öffne verschlossne Türn,\nLass uns die Freiheit spürn,\nBrich Quellen auf, Brich Quellen auf, Brich Quellen auf in mir.\nFreude, die nichts mehr hält,\nWir tanzen durch die Welt\nBrich Quellen auf, Brich Quellen auf, Brich Quellen auf in mir." }
                ]
            },
            {
                title: "Ich Weiss Wer Ich Bin",
                fontSize: 1.1,
                verses: [
                    { label: "Vers 1", text: "Wer bin ich, dass der König kam\nund mich empfing.\nWar verlor'n, doch Er nahm mich an.\nOh, wie Er mich liebt.\nOh, wie Er mich liebt." },
                    { label: "Chorus", text: "Wen der Sohn befreit, oh, ist wirklich frei.\nIch bin Gottes Kind, ja, sein Kind." },
                    { label: "Vers 2", text: "Endlich frei, voller Gnade hat\nEr mich erlöst.\nWar Sklave der Sünde, doch\nJesus starb für mich.\nJa, Er starb für mich." },
                    { label: "Chorus 2", text: "Wen der Sohn befreit, oh, ist wirklich frei.\nIch bin Gottes Kind, ja, sein Kind.\nDenn in seinem Haus ist ein Platz für mich.\nIch bin Gottes Kind, ja, sein Kind." },
                    { label: "Bridge", text: "Du erwählst mich und verlässt nicht.\nDurch Dich weiss ich wer ich bin.\nDu bist für mich, willst mein Bestes.\nDurch Dich weiss ich wer ich bin." }
                ]
            },
            {
                title: "I Love You",
                fontSize: 1.1,
                verses: [
                    { label: "Verse 1", text: "<span class='chord'>C</span>Lord, I just want to Praise You\n<span class='chord'>F</span>\n<span class='chord'>Dm</span>\n<span class='chord'>Gm</span>Lift my hands and say, \"I love You\"" },
                    { label: "Chorus", text: "<span class='chord'>Am</span>You are everything to me\n<span class='chord'>Dm</span>                    <span class='chord'>C</span>\n<span class='chord'>Gm</span>And I Exalt your Holy Name\n<span class='chord'>F</span>                  <span class='chord'>Bm</span>\nI Exalt your Holy Name\n<span class='chord'>Gm</span>                           <span class='chord'>C</span>\nI Exalt your Holy Name" }
                ]
            },
            {
                title: "Du allein rettest mich",
                fontSize: 1.1,
                verses: [
                    { label: "Intro", text: "<span class='chord'>B♭</span>, <span class='chord'>F</span>, <span class='chord'>Dm</span>, <span class='chord'>C</span>" },
                    { label: "Verse 1", text: "<span class='chord'>B♭</span>Jeder Mensch braucht Erbarmen\n<span class='chord'>F</span>                           <span class='chord'>Dm</span>                                <span class='chord'>C</span>\nunfehlbare Liebe, sei du mir gnädig, Herr" },
                    { label: "Verse 2", text: "<span class='chord'>B♭</span>Jeder Mensch braucht Vergebung\n<span class='chord'>F</span>                           <span class='chord'>Dm</span>                                <span class='chord'>C</span>\ndie gute des Erretters, der Völver Hoffnung" },
                    { label: "Chorus", text: "<span class='chord'>B♭</span>Strahle hell und lass die Welt\n<span class='chord'>F</span>\nes sein. Wir singen die zu Ehre,\n<span class='chord'>Dm</span>                           <span class='chord'>C</span>\nAuferstehenden Herr, Jesus" }
                ]
            },
            {
                title: "Du bist die Kraft, die mir oft fehlt",
                fontSize: 1.1,
                verses: [
                    { label: "Info", text: "Deutsch: Günther Balders\nText und Musik: Dennis Jemigan\nKey: h-moll (B♭m)" },
                    { label: "Intro", text: "<span class='chord'>G</span>, <span class='chord'>D</span>, <span class='chord'>D7</span>, <span class='chord'>G</span>" },
                    { label: "Verse 1", text: "<span class='chord'>G</span>Du bist die Kraft, die mir oft fehlt,\n<span class='chord'>D</span>du bist der Wert, der wirk-lich\n<span class='chord'>D7</span>zählt. Al-les bist du mir,\n<span class='chord'>G</span>Herr." },
                    { label: "Chorus", text: "<span class='chord'>Am7</span>You are everything to me,\n<span class='chord'>G/D</span>                    <span class='chord'>D7</span>\n<span class='chord'>C/G</span>And I Exalt your Holy Name\n<span class='chord'>G</span>                           <span class='chord'>D7</span>\nI Exalt your Holy Name" }
                ]
            },
            {
                title: "Vater, deine Liebe / I Will Sing Your Praises",
                fontSize: 1.1,
                verses: [
                    { label: "Info", text: "Nummer: 43\nTempo: ♩ = 136 BPM\nKey: Em" },
                    { label: "Verse", text: "           <span class='chord'>Em</span>                                                      <span class='chord'>D</span>\nVa-ter, dei-ne Lie-be ist so___ un-be-greif-lich\nFa-ther God, I won-der how I___ man-aged to ex-\n           <span class='chord'>C</span>\ngroß, und ich weiß gar nicht, wie ich le-ben konn-te___\nist with-out the know-ledge of Your par-ent-hood___\n<span class='chord'>D</span>                      <span class='chord'>B♭7</span>              <span class='chord'>Em</span>\noh-ne dich, o___ Herr. Doch machst du mich zu dei-nem Kind. Du\nand Your lov-ing___ care. But now I am Your child, I am a-\n<span class='chord'>D</span>                                                                           <span class='chord'>C</span>\nschenkst mir dei-ne Lie-be je-den Tag. Du lässt mich\ndopt-ed in Your fam-i-ly and I___ can nev-er\n           <span class='chord'>D</span>                                      <span class='chord'>B♭7</span>\nnie im Stich,___ denn Va-ter, du bist im-mer bei mir:\nbe a-lone,___ 'cause Fa-ther God, You're there be-side me." },
                    { label: "Chorus", text: "<span class='chord'>Em</span>              <span class='chord'>C</span>                      <span class='chord'>D</span>              <span class='chord'>G</span>                      <span class='chord'>Em</span>\nHerr, ich prei-se dei-nen heil-gen Na-men; du bist Kö-nig!\nI will sing Your prais-es, I will sing Your prais-es, I will" },
                    { label: "Ending", text: "<span class='chord'>Am7</span>                                                <span class='chord'>D</span>              <span class='chord'>B♭7</span>\nDu nur bist mein Herr und mein Gott.\nsing Your prais-es for ev-er-more.\n\n                  <span class='chord'>D</span>                      <span class='chord'>Em</span>\nHerr und mein Gott.\nfor ev-er-more." }
                ]
            },
            {
                title: "Vater, deine Liebe / I Will Sing Your Praises",
                fontSize: 1.1,
                verses: [
                    { label: "Info", text: "Nummer: 43\nTempo: ♩ = 136 BPM\nKey: Em" },
                    { label: "Verse", text: "           <span class='chord'>Em</span>                                                      <span class='chord'>D</span>\nVa-ter, dei-ne Lie-be ist so___ un-be-greif-lich\nFa-ther God, I won-der how I___ man-aged to ex-\n           <span class='chord'>C</span>\ngroß, und ich weiß gar nicht, wie ich le-ben konn-te___\nist with-out the know-ledge of Your par-ent-hood___\n<span class='chord'>D</span>                      <span class='chord'>B♭7</span>              <span class='chord'>Em</span>\noh-ne dich, o___ Herr. Doch machst du mich zu dei-nem Kind. Du\nand Your lov-ing___ care. But now I am Your child, I am a-\n<span class='chord'>D</span>                                                                           <span class='chord'>C</span>\nschenkst mir dei-ne Lie-be je-den Tag. Du lässt mich\ndopt-ed in Your fam-i-ly and I___ can nev-er\n           <span class='chord'>D</span>                                      <span class='chord'>B♭7</span>\nnie im Stich,___ denn Va-ter, du bist im-mer bei mir:\nbe a-lone,___ 'cause Fa-ther God, You're there be-side me." },
                    { label: "Chorus", text: "<span class='chord'>Em</span>              <span class='chord'>C</span>                      <span class='chord'>D</span>              <span class='chord'>G</span>                      <span class='chord'>Em</span>\nHerr, ich prei-se dei-nen heil-gen Na-men; du bist Kö-nig!\nI will sing Your prais-es, I will sing Your prais-es, I will" },
                    { label: "Ending", text: "<span class='chord'>Am7</span>                                                <span class='chord'>D</span>              <span class='chord'>B♭7</span>\nDu nur bist mein Herr und mein Gott.\nsing Your prais-es for ev-er-more.\n\n                  <span class='chord'>D</span>                      <span class='chord'>Em</span>\nHerr und mein Gott.\nfor ev-er-more." }
                ]
            }
        ];

        const colors = [
            'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
            'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
            'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
            'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
            'linear-gradient(135deg, #30cfd0 0%, #330867 100%)',
            'linear-gradient(135deg, #434343 0%, #000000 100%)',
            'linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)',
            'linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%)',
            'linear-gradient(135deg, #56ab2f 0%, #a8e063 100%)',
        ];

        let draggedIndex = null;
        let touchStartY = 0;
        let touchElement = null;

        function changeFontSize(index, change, event) {
            event.stopPropagation();
            songsData[index].fontSize += change;
            if (songsData[index].fontSize < 0.8) songsData[index].fontSize = 0.8;
            if (songsData[index].fontSize > 2.5) songsData[index].fontSize = 2.5;
            
            const card = document.querySelectorAll('.song-card')[index];
            const verses = card.querySelectorAll('.verse');
            verses.forEach(verse => {
                verse.style.fontSize = songsData[index].fontSize + 'em';
            });
        }

        function handleDragStart(e, index) {
            draggedIndex = index;
            e.currentTarget.classList.add('dragging');
        }

        function handleDragEnd(e) {
            e.currentTarget.classList.remove('dragging');
            draggedIndex = null;
        }

        function handleDragOver(e) {
            e.preventDefault();
        }

        function handleDrop(e, dropIndex) {
            e.preventDefault();
            
            if (draggedIndex === null || draggedIndex === dropIndex) return;
            
            const draggedSong = songsData[draggedIndex];
            songsData.splice(draggedIndex, 1);
            songsData.splice(dropIndex, 0, draggedSong);
            
            renderSongs();
        }

        function handleTouchStart(e, index) {
            if (e.target.closest('.control-btn')) return;
            
            draggedIndex = index;
            touchStartY = e.touches[0].clientY;
            touchElement = e.currentTarget;
            touchElement.classList.add('dragging');
            e.currentTarget.style.transition = 'none';
        }

        function handleTouchMove(e) {
            if (draggedIndex === null || !touchElement) return;
            
            e.preventDefault();
            const touchY = e.touches[0].clientY;
            const deltaY = touchY - touchStartY;
            
            touchElement.style.transform = `translateY(${deltaY}px)`;
            
            const cards = document.querySelectorAll('.song-card');
            cards.forEach((card, index) => {
                if (card === touchElement) return;
                
                const rect = card.getBoundingClientRect();
                const cardMiddle = rect.top + rect.height / 2;
                
                if (touchY > rect.top && touchY < rect.bottom) {
                    if (touchY < cardMiddle && index < draggedIndex) {
                        const draggedSong = songsData[draggedIndex];
                        songsData.splice(draggedIndex, 1);
                        songsData.splice(index, 0, draggedSong);
                        draggedIndex = index;
                        renderSongs();
                    } else if (touchY > cardMiddle && index > draggedIndex) {
                        const draggedSong = songsData[draggedIndex];
                        songsData.splice(draggedIndex, 1);
                        songsData.splice(index, 0, draggedSong);
                        draggedIndex = index;
                        renderSongs();
                    }
                }
            });
        }

        function handleTouchEnd(e) {
            if (touchElement) {
                touchElement.classList.remove('dragging');
                touchElement.style.transform = '';
                touchElement.style.transition = '';
            }
            touchElement = null;
            draggedIndex = null;
        }

        function toggleCard(cardElement, event) {
            if (event.target.closest('.control-btn')) {
                return;
            }
            cardElement.classList.toggle('expanded');
        }

        function createSongCard(song, index) {
            const card = document.createElement('div');
            card.className = 'song-card';
            card.draggable = true;
            
            card.addEventListener('dragstart', (e) => handleDragStart(e, index));
            card.addEventListener('dragend', handleDragEnd);
            card.addEventListener('dragover', handleDragOver);
            card.addEventListener('drop', (e) => handleDrop(e, index));

            card.addEventListener('touchstart', (e) => handleTouchStart(e, index), { passive: false });
            card.addEventListener('touchmove', handleTouchMove, { passive: false });
            card.addEventListener('touchend', handleTouchEnd);

            const header = document.createElement('div');
            header.className = 'song-header';
            header.style.background = colors[index % colors.length];
            header.onclick = (e) => toggleCard(card, e);

            const headerLeft = document.createElement('div');
            headerLeft.className = 'song-header-left';

            const number = document.createElement('div');
            number.className = 'song-number';
            number.textContent = index + 1;

            const title = document.createElement('div');
            title.className = 'song-title';
            title.textContent = song.title;

            const icon = document.createElement('div');
            icon.className = 'expand-icon';
            icon.textContent = '▼';

            headerLeft.appendChild(number);
            headerLeft.appendChild(title);
            header.appendChild(headerLeft);
            header.appendChild(icon);

            const content = document.createElement('div');
            content.className = 'song-content';

            const controls = document.createElement('div');
            controls.className = 'song-controls';

            const fontGroup = document.createElement('div');
            fontGroup.className = 'control-group';
            
            const fontLabel = document.createElement('span');
            fontLabel.className = 'control-label';
            fontLabel.textContent = 'Schriftgröße:';
            
            const decreaseBtn = document.createElement('button');
            decreaseBtn.className = 'control-btn';
            decreaseBtn.textContent = 'A-';
            decreaseBtn.onclick = (e) => changeFontSize(index, -0.1, e);
            
            const increaseBtn = document.createElement('button');
            increaseBtn.className = 'control-btn';
            increaseBtn.textContent = 'A+';
            increaseBtn.onclick = (e) => changeFontSize(index, 0.1, e);

            fontGroup.appendChild(fontLabel);
            fontGroup.appendChild(decreaseBtn);
            fontGroup.appendChild(increaseBtn);

            controls.appendChild(fontGroup);
            content.appendChild(controls);

            song.verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                verseDiv.style.fontSize = song.fontSize + 'em';

                const label = document.createElement('span');
                label.className = 'verse-label';
                label.textContent = verse.label;

                const text = document.createElement('div');
                text.style.whiteSpace = 'pre-line';
                text.innerHTML = verse.text;

                verseDiv.appendChild(label);
                verseDiv.appendChild(text);
                content.appendChild(verseDiv);
            });

            card.appendChild(header);
            card.appendChild(content);

            return card;
        }

        function renderSongs() {
            const container = document.getElementById('songsContainer');
            container.innerHTML = '';
            songsData.forEach((song, index) => {
                container.appendChild(createSongCard(song, index));
            });
        }

        renderSongs();
    </script>
</body>
</html>
